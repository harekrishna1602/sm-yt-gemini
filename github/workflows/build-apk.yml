name: Build & Publish sm-yt-gemini APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode Release Keystore (if GitHub Secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release.jks" >> $GITHUB_ENV
          fi

      - name: Extract App Version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/sm-yt-gemini-v${APP_VERSION}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-yt-gemini-v${{ env.APP_VERSION }}-apk
          path: app/build/outputs/apk/release/sm-yt-gemini-v${{ env.APP_VERSION }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          APK_FILE="app/build/outputs/apk/release/sm-yt-gemini-v${APP_VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "YT Gemini ${TAG} — Phase 4 (YouTube Channel Stats + Accountability)" \
              --notes "Phase 4: Official YouTube Data API v3 mobile-first channel stats, Watch-vs-Create accountability tracker, Creator Streak & Badges, and 1-tap Binge-to-Build AI Flip."
          fi
